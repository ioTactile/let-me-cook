version: '3.8'

networks:
  letmecook-network:
    driver: bridge

services:
  postgres:
    image: ankane/pgvector:latest
    networks:
      - letmecook-network
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: letmecook
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    networks:
      - letmecook-network
    volumes:
      - redis_data:/data
    deploy:
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  letmecook-back:
    build:
      context: .
      dockerfile: Dockerfile.prod
    networks:
      - letmecook-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - '8000'
    env_file:
      - .env.production
    deploy:
      restart_policy:
        condition: on-failure

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    networks:
      - letmecook-network
    depends_on:
      letmecook-back:
        condition: service_started
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    deploy:
      restart_policy:
        condition: on-failure

volumes:
  postgres_data:
  redis_data:
